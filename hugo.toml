baseURL = "https://tadorne.org/"
title = "Tadorne"
enableRobotsTXT = true
enableEmoji = false
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
summaryLength = 30
timeZone = "Europe/Paris"

[params]
  motto = "duck engineering"
  contact = "contact@tadorne.org"
  # GPG fingerprint placeholder. Replace here AND in content/*/verify*.md
  # once the real ed25519 key exists. Rendered grouped in blocks of four.
  gpgFingerprint = "5420 08E3 53EC A628 B4D6  ACAD 8C03 243A FF69 5BF7"
  gpgUid = "Tadorne <contact@tadorne.org>"
  # Social card. Raster, not SVG: X and most scrapers refuse SVG previews.
  # Generated by brand/social/build-social-assets.py
  ogImage = "/img/og-default.png"
  ogImageWidth = 1200
  ogImageHeight = 630
  ogImageAlt = "Tadorne — duck engineering — tadorne.org"
  # The brand account, never a personal one (brand/IDENTITY-OPS.md §5).
  xHandle = "@tadorne"
  xUrl = "https://x.com/tadorne"
  # Invite links expire: this one is time-limited (1 November 2026), so it
  # needs revisiting — replace it with a never-expiring invite, or the footer
  # link rots silently. Check with:
  #   curl -s https://discord.com/api/v9/invites/<code> | grep expires_at
  discordUrl = "https://discord.gg/BcYjkDu3v"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[services]
  [services.disqus]
    shortname = ""
  [services.googleAnalytics]
    id = ""

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[languages]

  [languages.en]
    locale = "en-GB"
    label = "English"
    direction = "ltr"
    contentDir = "content/en"
    weight = 1
    title = "Tadorne"
    [languages.en.params]
      description = "Open hardware and deep-tech engineering."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Projects"
        pageRef = "/projects"
        weight = 10
      [[languages.en.menus.main]]
        name = "Log"
        pageRef = "/log"
        weight = 20
      [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about"
        weight = 30
      [[languages.en.menus.main]]
        name = "Verify"
        pageRef = "/verify"
        weight = 40

  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    direction = "ltr"
    contentDir = "content/fr"
    weight = 2
    title = "Tadorne"
    [languages.fr.params]
      description = "Matériel libre et ingénierie deep-tech."
    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = "Projets"
        pageRef = "/projets"
        weight = 10
      [[languages.fr.menus.main]]
        name = "Journal"
        pageRef = "/journal"
        weight = 20
      [[languages.fr.menus.main]]
        name = "À propos"
        pageRef = "/a-propos"
        weight = 30
      [[languages.fr.menus.main]]
        name = "Vérifier"
        pageRef = "/verifier"
        weight = 40
